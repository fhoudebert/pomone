# Build à la demande : aucun déclenchement sur push.
# Onglet Actions → « Build Pomone » → Run workflow. Le bouton n'apparaît que lorsque ce
# fichier est présent sur la branche par défaut (main) ; le champ « ref » choisit ce qui est construit.
name: Build Pomone

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branche, tag ou SHA à construire
        default: main
        required: true
      plateformes:
        description: Plateformes à construire
        type: choice
        default: toutes
        options: [toutes, linux, windows, macos]
      publier_release:
        description: Créer une release brouillon avec les binaires
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier (tests, pages hors ligne)
    runs-on: ubuntu-22.04
    outputs:
      matrice: ${{ steps.plan.outputs.matrice }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pages dans Chrome (interactions, accessibilité, impression)
        run: npm run test:e2e
      - name: Licences des dépendances distribuées
        run: npm run licences
      - name: Générer le verger d'exemple et contrôler qu'il est autonome
        run: |
          npm run pomone -- build exemples/verger-arboretum.xlsx -o site --rapport
          npm run pomone -- build exemples/verger-arboretum.xlsx -o site-unique --unique
          if grep -rlE 'https?://' site site-unique; then
            echo "::error::Les pages produites contiennent une adresse réseau"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-exemple
          path: site
          retention-days: 30
      - id: plan
        name: Choisir les plateformes
        env:
          PLATEFORMES: ${{ inputs.plateformes }}
        run: |
          linux='{"cle":"linux","os":"ubuntu-22.04","args":"","cible":""}'
          windows='{"cle":"windows","os":"windows-latest","args":"","cible":""}'
          macos='{"cle":"macos","os":"macos-latest","args":"--target universal-apple-darwin","cible":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          case "$PLATEFORMES" in
            linux) m="[$linux]" ;;
            windows) m="[$windows]" ;;
            macos) m="[$macos]" ;;
            *) m="[$linux,$windows,$macos]" ;;
          esac
          echo "matrice={\"include\":$m}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.cle }}
    needs: verifier
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verifier.outputs.matrice) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Dépendances système (Linux)
        if: matrix.cle == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.cible }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Construire l'application
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Tests Rust
        if: matrix.cle == 'linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pomone-${{ matrix.cle }}
          retention-days: 30
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    name: Release brouillon
    if: inputs.publier_release
    needs: [verifier, build]
    runs-on: ubuntu-22.04
    # Environnement protégé : à créer dans Settings → Environments, réservé au mainteneur.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pomone-*
          path: binaires
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          tag_name: v${{ needs.verifier.outputs.version }}
          target_commitish: ${{ inputs.ref }}
          name: Pomone ${{ needs.verifier.outputs.version }}
          generate_release_notes: false
          files: binaires/**/*
