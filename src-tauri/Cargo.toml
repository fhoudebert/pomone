[package]
name = "pomone"
version = "0.1.0"
description = "Du classeur du verger aux pages HTML : plan visuel et fiches des arbres, hors ligne."
authors = ["François Houdebert"]
license = "MIT"
repository = "https://github.com/fhoudebert/pomone"
edition = "2021"

[lib]
name = "pomone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
